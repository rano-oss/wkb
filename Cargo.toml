[workspace]
members = ["."]

[package]
name = "wayland-keyboard"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Lightweight keyboard handling library for Wayland — a pure Rust alternative to xkbcommon"
license = "MIT"
repository = "https://github.com/rano-oss/wkb"
readme = "README.md"
keywords = ["keyboard", "wayland", "xkb", "input", "linux"]
categories = ["os::linux-apis"]
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[lib]
name = "wkb"

[features]
default = ["xkb", "compose"]
xkb = ["dep:xkeysym"]
compose = []

[dependencies]
log = "0.4.29"
arrayvec = "0.7"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
thiserror = "2"
lasso = "0.7"
bitflags = "2"
xkeysym = { version = "0.2", optional = true }

[dev-dependencies]
wkb = { package = "wayland-keyboard", path = "." }
test-case = "3.3.1"
xkbcommon = "0.9.0"
xkbcommon-dl = "0.4.2"
criterion = { version = "0.8", features = ["html_reports"] }
quick-xml = "0.41"

[[bench]]
name = "bench_setup"
harness = false

[[bench]]
name = "bench_key"
harness = false

[[bench]]
name = "bench_compose"
harness = false

[[example]]
name = "bench_memory"

[[example]]
name = "bench_size_wkb"

[[example]]
name = "bench_size_wkb_xkb"

[[example]]
name = "bench_size_xkbcommon_dl"

[[example]]
name = "bench_size_xkbcommon"
