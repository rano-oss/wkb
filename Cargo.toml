[package]
name = "wayland-keyboard"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Lightweight keyboard handling library for Wayland — a pure Rust alternative to xkbcommon"
license = "MIT"
repository = "https://github.com/rano-oss/wkb"
readme = "README.md"
keywords = ["keyboard", "wayland", "xkb", "input", "linux"]
categories = ["os::linux-apis"]
include = [
    "src/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[lib]
name = "wkb"

[features]
default = ["xkb", "compose"]
xkb = [
    "dep:bitflags",
    "dep:lasso",
    "dep:xkeysym",
]
compose = []

[dependencies]
arrayvec = "0.7"
bitflags = { version = "2", optional = true }
lasso = { version = "0.7", optional = true }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
xkeysym = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
quick-xml = "0.41"
test-case = "3.3.1"
xkbcommon = "0.9.0"
xkbcommon-dl = "0.4.2"

[[bench]]
name = "bench_setup"
harness = false
required-features = ["xkb", "compose"]

[[bench]]
name = "bench_key"
harness = false
required-features = ["xkb"]

[[bench]]
name = "bench_compose"
harness = false
required-features = ["xkb", "compose"]

[[example]]
name = "bench_memory"
required-features = ["xkb", "compose"]

[[example]]
name = "bench_size_wkb"

[[example]]
name = "bench_size_wkb_xkb"
required-features = ["xkb", "compose"]

[[example]]
name = "bench_size_xkbcommon"
required-features = ["xkb", "compose"]

[[example]]
name = "bench_size_xkbcommon_dl"
required-features = ["xkb", "compose"]
