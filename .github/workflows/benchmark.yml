name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install system dependencies
        run: dnf install -y gcc git binutils libxkbcommon-devel xkeyboard-config libX11-common nodejs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run criterion benchmarks
        run: |
          cargo bench --bench bench_setup --no-default-features --features xkb,compositor
          cargo bench --bench bench_setup_client --no-default-features --features xkb,client
          cargo bench --bench bench_key --no-default-features --features xkb,compositor
          cargo bench --bench bench_key_client --no-default-features --features xkb,client
          cargo bench --bench bench_compose --no-default-features --features xkb,client

      - name: Run memory benchmark
        run: |
          cargo build --example bench_memory --release --no-default-features --features xkb,client
          ./target/release/examples/bench_memory > /tmp/mem_output.txt 2>&1

      - name: Measure binary sizes
        run: |
          cargo build --example bench_size_wkb --release --no-default-features --features compositor
          cargo build --example bench_size_wkb_xkb --release --no-default-features --features xkb,client
          cargo build --example bench_size_xkbcommon --release --no-default-features --features xkb,client
          cargo build --example bench_size_xkbcommon_dl --release --no-default-features --features xkb,client
          for bin in bench_size_wkb bench_size_wkb_xkb bench_size_xkbcommon bench_size_xkbcommon_dl; do
            strip target/release/examples/$bin
          done
          # Find libxkbcommon.so and get its stripped size (xkbcommon/xkbcommon-dl depend on it)
          LIBXKB=$(find /usr/lib64 /usr/lib -name 'libxkbcommon.so.0.*' 2>/dev/null | head -1)
          if [ -n "$LIBXKB" ]; then
            strip --strip-all -o /tmp/libxkbcommon_stripped.so "$LIBXKB"
            LIBXKB_SIZE=$(stat -c%s /tmp/libxkbcommon_stripped.so)
          else
            LIBXKB_SIZE=0
          fi
          {
            echo "bench_size_wkb $(stat -c%s target/release/examples/bench_size_wkb)"
            echo "bench_size_wkb_xkb $(stat -c%s target/release/examples/bench_size_wkb_xkb)"
            echo "bench_size_xkbcommon $(( $(stat -c%s target/release/examples/bench_size_xkbcommon) + LIBXKB_SIZE ))"
            echo "bench_size_xkbcommon_dl $(( $(stat -c%s target/release/examples/bench_size_xkbcommon_dl) + LIBXKB_SIZE ))"
          } > /tmp/size_output.txt

      - name: Generate benchmark table
        run: node scripts/generate_benchmark_table.js --mem=/tmp/mem_output.txt --size=/tmp/size_output.txt --update-readme

      - name: Commit updated README
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || {
            git add README.md
            git commit -m "docs: update benchmark results [skip ci]"
            git push origin "HEAD:${REF}"
          }
        env:
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
