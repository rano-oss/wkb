name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-unit-doc:
    name: test (lib + doc)
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install system dependencies
        run: dnf install -y gcc libxkbcommon-devel xkeyboard-config libX11-common

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run lib tests
        run: cargo test --lib

      - name: Run doc tests
        run: cargo test --doc

  test-independent:
    name: test (${{ matrix.test_target }})
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        test_target:
          - compose
          - ctrl_keys_combo
          - ctrl_keys_function
          - ir
          - keymap
          - compile
          - groups
          - type
          - led_lights
          - levels_level_keys
          - levels_keysym
          - locks_caps_lock
          - locks_caps_num_lock
          - locks_level
          - locks_num_lock
          - locks_state
          - modifiers
          - repeat
          - unicode
    steps:
      - name: Install system dependencies
        run: dnf install -y gcc libxkbcommon-devel xkeyboard-config libX11-common

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Run test target
        run: cargo test --test ${{ matrix.test_target }}
